name: Keystone R Data Mining CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R environment
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("dplyr", "ggplot2", "caret", "e1071", "pROC", "ISLR", "testthat", "lintr"))'

      - name: Run static analysis (lintr)
        run: |
          Rscript -e 'errors <- lintr::lint_dir("R"); print(errors); if (length(errors) > 0) quit(status = 1)'

      - name: Run unit tests (testthat)
        run: |
          Rscript -e 'for (f in list.files("R", full.names = TRUE)) source(f); results <- testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Run Carseats Naive Bayes pipeline smoke test
        run: |
          Rscript scripts/run_carseats_pipeline.R
